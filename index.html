<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الأستاذ محمد سلهب - الموسيقى العربية الأصيلة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://www.paypal.com/sdk/js?client-id=test&currency=USD"></script>

    <style>
        /* --- التنسيقات الأصلية التي أرسلتها مع تحسينات بسيطة --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background: #0a0a0a; color: #d4af37; min-height: 100vh; }
        .navbar { background: rgba(26, 26, 26, 0.95); backdrop-filter: blur(10px); border-bottom: 2px solid #d4af37; padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo { font-family: 'Playfair Display', serif; font-size: 2.2rem; font-weight: 700; color: #d4af37; }
        
        .container { max-width: 1200px; margin: 2rem auto; padding: 0 20px; }
        
        /* كرت المنتج */
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 2rem; }
        .product-card { background: #1a1a1a; border: 1px solid #d4af37; border-radius: 15px; padding: 1.5rem; text-align: center; transition: 0.3s; }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(212, 175, 55, 0.2); }
        .product-price { font-size: 1.5rem; margin: 1rem 0; color: #f5e6b3; }
        .add-to-cart { width: 100%; padding: 0.8rem; background: transparent; border: 1px solid #d4af37; color: #d4af37; cursor: pointer; font-weight: bold; }
        .add-to-cart:hover { background: #d4af37; color: #000; }

        /* نافذة السلة */
        .cart-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center; }
        .cart-modal.active { display: flex; }
        .cart-content { background: #1a1a1a; border: 2px solid #d4af37; border-radius: 20px; padding: 2rem; width: 90%; max-width: 500px; }
        .cart-item { display: flex; justify-content: space-between; margin-bottom: 1rem; border-bottom: 1px solid #333; padding-bottom: 0.5rem; }
        
        /* حاوية زر باي بال */
        #paypal-button-container { margin-top: 20px; display: none; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">مُحمد سلهب</div>
        <div class="cart-icon" onclick="toggleCart()">
            <i class="fas fa-shopping-cart"></i>
            <span class="cart-count" id="cart-count">0</span>
        </div>
    </nav>

    <div class="container">
        <header class="hero" style="text-align: center; padding: 3rem 0;">
            <h1 style="font-size: 3rem; margin-bottom: 1rem;">أكاديمية الموسيقى العربية</h1>
            <p>تعلم أصول المقامات والعزف بأسلوب أكاديمي محترف</p>
        </header>

        <div class="products-grid">
            <div class="product-card">
                <h3>دورة المقامات الشرقية</h3>
                <p>شرح مفصل لـ 9 مقامات أساسية</p>
                <div class="product-price">$49.99</div>
                <button class="add-to-cart" onclick="addToCart('دورة المقامات', 49.99)">إضافة للسلة</button>
            </div>
            <div class="product-card">
                <h3>كتاب النوتة الموسيقية</h3>
                <p>أهم المقطوعات الكلاسيكية</p>
                <div class="product-price">$19.00</div>
                <button class="add-to-cart" onclick="addToCart('كتاب النوتة', 19.00)">إضافة للسلة</button>
            </div>
        </div>
    </div>

    <div class="cart-modal" id="cartModal">
        <div class="cart-content">
            <div style="display: flex; justify-content: space-between; margin-bottom: 1rem;">
                <h2>سلة المشتريات</h2>
                <button onclick="toggleCart()" style="background:none; border:none; color:#d4af37; font-size: 1.5rem; cursor:pointer;">&times;</button>
            </div>
            <div id="cart-items-list">
                </div>
            <div class="cart-total" style="margin-top: 1rem; font-size: 1.2rem; font-weight: bold; border-top: 2px solid #d4af37; padding-top: 1rem;">
                المجموع: <span id="total-price" class="total-price">0</span> $
            </div>
            
            <button id="checkout-btn" class="add-to-cart" style="margin-top: 1rem;" onclick="showPaymentOptions()">إتمام الشراء والتحصيل</button>
            
            <div id="paypal-button-container"></div>
        </div>
    </div>

    <script>
        let cart = [];
        let total = 0;

        function addToCart(name, price) {
            cart.push({name, price});
            updateCartUI();
        }

        function updateCartUI() {
            const list = document.getElementById('cart-items-list');
            const count = document.getElementById('cart-count');
            const priceTag = document.getElementById('total-price');
            
            list.innerHTML = '';
            total = 0;
            
            cart.forEach((item, index) => {
                total += item.price;
                list.innerHTML += `
                    <div class="cart-item">
                        <span>${item.name}</span>
                        <span>${item.price} $</span>
                    </div>
                `;
            });
            
            count.innerText = cart.length;
            priceTag.innerText = total.toFixed(2);
        }

        function toggleCart() {
            document.getElementById('cartModal').classList.toggle('active');
            // إخفاء أزرار باي بال عند إغلاق السلة لإعادة تهيئتها لاحقاً
            document.getElementById('paypal-button-container').style.display = 'none';
            document.getElementById('checkout-btn').style.display = 'block';
        }

        function showPaymentOptions() {
            if (total <= 0) return alert('السلة فارغة!');
            document.getElementById('checkout-btn').style.display = 'none';
            document.getElementById('paypal-button-container').style.display = 'block';
        }

        // --- أتمتة باي بال ---
        paypal.Buttons({
            createOrder: function(data, actions) {
                return actions.order.create({
                    purchase_units: [{
                        amount: {
                            value: total.toFixed(2) // يستخدم المجموع الحقيقي في السلة
                        }
                    }]
                });
            },
            onApprove: function(data, actions) {
                return actions.order.capture().then(function(details) {
                    alert('شكراً لك ' + details.payer.name.given_name + '! تم تأكيد عملية الدفع بنجاح.');
                    // هنا يمكن إرسال البيانات لسيرفرك لحفظ الطلب
                    cart = [];
                    updateCartUI();
                    toggleCart();
                });
            }
        }).render('#paypal-button-container');
    </script>
</body>
</html>
