<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الأستاذ محمد سلهب - الموسيقى العربية الأصيلة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Cairo', sans-serif;
            background: #0a0a0a;
            color: #d4af37;
            overflow-x: hidden;
            perspective: 2000px; /* ضروري لتأثير العمق */
        }

        /* حاوية العرض ثلاثية الأبعاد */
        #scene {
            width: 100%;
            transition: transform 1.2s cubic-bezier(0.645, 0.045, 0.355, 1);
            transform-style: preserve-3d;
        }

        .navbar {
            background: rgba(26, 26, 26, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid #d4af37;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
        }

        .master-name {
            display: inline-block;
            background: linear-gradient(135deg, #d4af37, #f5e6b3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.5rem;
            font-weight: 700;
            padding: 5px 15px;
            border: 2px solid #d4af37;
            border-radius: 50px;
        }

        .nav-links { display: flex; gap: 2rem; align-items: center; }
        .nav-links a { 
            text-decoration: none; 
            color: #f5e6b3; 
            font-weight: 600; 
            cursor: pointer;
            transition: 0.3s;
        }
        .nav-links a:hover { color: #d4af37; transform: scale(1.1); }

        .container { 
            max-width: 1200px; 
            margin: 100px auto; 
            padding: 20px; 
            transform-style: preserve-3d;
        }

        /* تأثيرات الأقسام */
        section {
            margin-bottom: 100px;
            transition: transform 0.8s, opacity 0.8s;
            backface-visibility: hidden;
        }

        .hero {
            background: linear-gradient(135deg, #2a2a2a, #1a1a1a);
            border: 2px solid #d4af37;
            border-radius: 30px;
            padding: 5rem 2rem;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .products-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
            gap: 2rem; 
        }

        .product-card { 
            background: #2a2a2a; 
            border: 1px solid #d4af37; 
            border-radius: 20px; 
            padding: 20px;
            transition: 0.5s;
            transform-style: preserve-3d;
        }

        .product-card:hover {
            transform: translateZ(30px) rotateY(10deg);
            border-color: #f5e6b3;
            box-shadow: 0 15px 30px rgba(212, 175, 55, 0.2);
        }

        /* أنيميشن الانتقال ثلاثي الأبعاد */
        .page-transition {
            animation: flipScene 1.2s ease-in-out;
        }

        @keyframes flipScene {
            0% { transform: translateZ(0) rotateX(0); opacity: 1; }
            50% { transform: translateZ(-500px) rotateX(10deg); opacity: 0.5; }
            100% { transform: translateZ(0) rotateX(0); opacity: 1; }
        }

        .add-to-cart, .submit-btn {
            width: 100%; padding: 12px; background: #d4af37; border: none;
            border-radius: 10px; cursor: pointer; font-weight: bold; margin-top: 10px;
        }

        .custom-request { background: #1e1e1e; border: 2px solid #d4af37; border-radius: 30px; padding: 40px; }
        .form-group input, textarea { width: 100%; padding: 10px; margin-top: 10px; background: #333; border: 1px solid #d4af37; color: white; border-radius: 8px; }

        footer { text-align: center; padding: 40px; border-top: 1px solid #d4af37; margin-top: 50px; }

    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo"><span class="master-name">محمد سلهب</span></div>
        <div class="nav-links">
            <a onclick="navigateTo('home')">الرئيسية</a>
            <a onclick="navigateTo('products')">النوتات</a>
            <a onclick="navigateTo('custom')">طلب خاص</a>
            <a onclick="navigateTo('contact')">اتصل بنا</a>
        </div>
    </nav>

    <div id="scene">
        <div class="container">
            <section id="home" class="hero">
                <h1>الموسيقى العربية الأصيلة</h1>
                <p>نوتات نادرة وتعليم احترافي مع الأستاذ محمد سلهب</p>
                <div style="font-size: 3rem; margin-top: 20px;">🎻 🎼</div>
            </section>

            <section id="products">
                <h2 style="text-align: center; margin-bottom: 30px;">النوتات الموسيقية</h2>
                <div class="products-grid" id="sheetMusicProducts">
                    </div>
            </section>

            <section id="custom" class="custom-request">
                <h2>طلب تعليمي خاص</h2>
                <div class="form-group">
                    <input type="text" id="fullName" placeholder="الاسم الكامل">
                    <textarea id="topic" placeholder="ما هي الأغنية أو المقام الذي تريد تعلمه؟" rows="4"></textarea>
                    <button class="submit-btn" onclick="sendOrder()">إرسال عبر واتساب <i class="fab fa-whatsapp"></i></button>
                </div>
            </section>

            <section id="contact" style="text-align: center;">
                <div class="product-card" style="max-width: 500px; margin: 0 auto;">
                    <h3>تواصل مباشر</h3>
                    <p style="margin: 20px 0;">الأستاذ محمد سلهب</p>
                    <a href="https://wa.me/966593436094" style="color: #d4af37; font-size: 1.5rem; text-decoration: none;">00966593436094</a>
                </div>
            </section>
        </div>
    </div>

    <footer>
        <p>جميع الحقوق محفوظة © 2026 - الأستاذ محمد سلهب</p>
    </footer>

    <script>
        // دالة التنقل ثلاثي الأبعاد
        function navigateTo(sectionId) {
            const scene = document.getElementById('scene');
            const target = document.getElementById(sectionId);

            // إضافة أنيميشن الانقلاب
            scene.classList.add('page-transition');
            
            setTimeout(() => {
                target.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 500);

            // إزالة الكلاس بعد انتهاء الحركة
            setTimeout(() => {
                scene.classList.remove('page-transition');
            }, 1200);
        }

        // بيانات المنتجات
        const products = [
            { title: 'نوتة أنت عمري', price: '25$' },
            { title: 'نوتة سألوني الناس', price: '20$' },
            { title: 'دورة المقامات', price: '75$' }
        ];

        const container = document.getElementById('sheetMusicProducts');
        products.forEach(p => {
            container.innerHTML += `
                <div class="product-card">
                    <i class="fas fa-music" style="font-size: 2rem;"></i>
                    <h3 style="margin: 15px 0;">${p.title}</h3>
                    <p>السعر: ${p.price}</p>
                    <button class="add-to-cart">أضف للسلة</button>
                </div>
            `;
        });

        function sendOrder() {
            const name = document.getElementById('fullName').value;
            const topic = document.getElementById('topic').value;
            const msg = `مرحباً أستاذ محمد، أنا ${name} أريد طلب خاص: ${topic}`;
            window.open(`https://wa.me/966593436094?text=${encodeURIComponent(msg)}`);
        }

        // إضافة تأثير حركة الماوس 3D على الهيرو
        const hero = document.querySelector('.hero');
        document.addEventListener('mousemove', (e) => {
            let x = (window.innerWidth / 2 - e.pageX) / 30;
            let y = (window.innerHeight / 2 - e.pageY) / 30;
            hero.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
        });
    </script>
</body>
</html>
